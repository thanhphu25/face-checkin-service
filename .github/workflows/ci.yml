name: CI

on:
  push:
    branches: [main, week4, week5]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Enforce architecture boundaries
        run: uv run lint-imports

      - name: Smoke test app startup
        env:
          JWT_SECRET: ci-smoke-test-only-secret
        run: uv run python -c "from app.main import app; print(app.title)"

      - name: Unit, API and SQLite integration tests
        env:
          JWT_SECRET: ci-test-only-secret
        run: uv run pytest -q -m "not real_model" tests/unit tests/api tests/integration

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: facecheckin_ci_test
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d facecheckin_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Run Alembic migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://ci_test:ci-test-only-password@127.0.0.1:5432/facecheckin_ci_test
          JWT_SECRET: ci-migration-test-only-secret
        run: uv run alembic upgrade head

      - name: PostgreSQL repository integration tests
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://ci_test:ci-test-only-password@127.0.0.1:5432/facecheckin_ci_test
          REQUIRE_POSTGRES_TESTS: "1"
          JWT_SECRET: ci-postgres-test-only-secret
        run: uv run pytest -q tests/integration -p no:cacheprovider

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag face-checkin-service:ci .

  compose-clean-setup:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: facecheckin_ci_clean
      APP_IMAGE: face-checkin-service:ci-clean
      JWT_SECRET: ci-clean-compose-test-only-secret
      POSTGRES_DB: facecheckin_ci_clean_test
      POSTGRES_USER: ci_clean
      POSTGRES_PASSWORD: ci-clean-test-only-password
      APP_PORT: "58005"
      POSTGRES_PORT: "55435"
      REDIS_PORT: "56385"
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Compose image from scratch
        run: docker compose build --no-cache

      - name: Start clean Compose stack
        run: docker compose up -d --wait

      - name: Verify migration, dependencies and HTTP endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:58005/health
          curl --fail --silent --show-error http://127.0.0.1:58005/openapi.json > /dev/null
          test "$(docker compose exec -T postgres psql -U ci_clean -d facecheckin_ci_clean_test -Atc 'select version_num from alembic_version;')" = "0002"
          test "$(docker compose exec -T redis redis-cli ping)" = "PONG"
          docker compose exec -T app python -c "from app.api.deps import get_engine; assert get_engine().dialect.name == 'postgresql'"

      - name: Show Compose diagnostics on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color

      - name: Remove isolated Compose resources
        if: always()
        run: docker compose down -v --remove-orphans

      - name: Verify Compose cleanup
        if: always()
        run: |
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=facecheckin_ci_clean)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=facecheckin_ci_clean)"
