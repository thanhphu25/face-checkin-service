name: CI

on:
  push:
    branches: [main, week4, week5]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Enforce architecture boundaries
        run: uv run lint-imports

      - name: Smoke test app startup
        env:
          JWT_SECRET: ci-smoke-test-only-secret
        run: uv run python -c "from app.main import app; print(app.title)"

      - name: Unit, API and SQLite integration tests
        env:
          JWT_SECRET: ci-test-only-secret
        run: uv run pytest -q -m "not real_model" tests/unit tests/api tests/integration

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: facecheckin_ci_test
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d facecheckin_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Run Alembic migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://ci_test:ci-test-only-password@127.0.0.1:5432/facecheckin_ci_test
          JWT_SECRET: ci-migration-test-only-secret
        run: uv run alembic upgrade head

      - name: PostgreSQL repository integration tests
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://ci_test:ci-test-only-password@127.0.0.1:5432/facecheckin_ci_test
          REQUIRE_POSTGRES_TESTS: "1"
          JWT_SECRET: ci-postgres-test-only-secret
        run: uv run pytest -q tests/integration -p no:cacheprovider

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag face-checkin-service:ci .
