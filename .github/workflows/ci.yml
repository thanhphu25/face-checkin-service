name: CI

on:
  push:
    branches: [main, week4]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cài dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Kiểm tra phân tầng (import-linter)
        run: uv run lint-imports

      - name: Smoke test — app khởi động được
        env:
          JWT_SECRET: ci-secret-khong-dung-that
        run: uv run python -c "from app.main import app; print(app.title)"

      - name: Tests
        env:
          JWT_SECRET: ci-test-secret-khong-dung-that
        run: uv run pytest -q
