name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Kiểm tra phân tầng (import-linter)
        run: lint-imports

      - name: Smoke test — app khởi động được
        env:
          JWT_SECRET: ci-secret-khong-dung-that
        run: python -c "from app.main import app; print(app.title)"
